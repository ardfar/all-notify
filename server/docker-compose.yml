services:
  all-notify-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: all-notify-server:latest
    container_name: all-notify-server
    restart: unless-stopped
    environment:
      ALLNOTIFY_ADDR: ":8080"
      ALLNOTIFY_DATA_DIR: "/data"
      ALLNOTIFY_TTL_HOURS: "${ALLNOTIFY_TTL_HOURS:-24}"
      ALLNOTIFY_MAX_EVENT_BYTES: "${ALLNOTIFY_MAX_EVENT_BYTES:-65536}"
      ALLNOTIFY_MAX_BLOB_BYTES: "${ALLNOTIFY_MAX_BLOB_BYTES:-563200}"
      ALLNOTIFY_MAX_TOTAL_BLOB_MB: "${ALLNOTIFY_MAX_TOTAL_BLOB_MB:-256}"
      ALLNOTIFY_ADMIN_ENABLED: "${ALLNOTIFY_ADMIN_ENABLED:-true}"
      ALLNOTIFY_PAIRING_CODE_TTL_MINUTES: "${ALLNOTIFY_PAIRING_CODE_TTL_MINUTES:-10}"
      ALLNOTIFY_ADMIN_SESSION_MINUTES: "${ALLNOTIFY_ADMIN_SESSION_MINUTES:-30}"
      ALLNOTIFY_TRUST_PROXY: "${ALLNOTIFY_TRUST_PROXY:-false}"
    volumes:
      - ./data:/data
    ports:
      - "${ALLNOTIFY_BIND_ADDR:-127.0.0.1:8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: all-notify-caddy
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      all-notify-server:
        condition: service_healthy
    environment:
      ALLNOTIFY_DOMAIN: "${ALLNOTIFY_DOMAIN:-}"
    command:
      - sh
      - -c
      - 'test -n "$$ALLNOTIFY_DOMAIN" || { echo "ALLNOTIFY_DOMAIN is required when using --profile tls" >&2; exit 1; }; exec caddy reverse-proxy --from "$$ALLNOTIFY_DOMAIN" --to all-notify-server:8080'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
