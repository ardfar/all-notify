services:
  all-notify-server:
    image: ${ALLNOTIFY_IMAGE:-ghcr.io/ardfar/all-notify-server:latest}
    container_name: all-notify-server
    restart: unless-stopped
    pull_policy: always
    environment:
      ALLNOTIFY_ADDR: ":8080"
      ALLNOTIFY_DATA_DIR: "/data"
      ALLNOTIFY_TTL_HOURS: "${ALLNOTIFY_TTL_HOURS:-24}"
      ALLNOTIFY_MAX_EVENT_BYTES: "${ALLNOTIFY_MAX_EVENT_BYTES:-65536}"
      ALLNOTIFY_MAX_BLOB_BYTES: "${ALLNOTIFY_MAX_BLOB_BYTES:-563200}"
      ALLNOTIFY_MAX_TOTAL_BLOB_MB: "${ALLNOTIFY_MAX_TOTAL_BLOB_MB:-256}"
    volumes:
      - ./data:/data
    ports:
      - "${ALLNOTIFY_BIND_ADDR:-0.0.0.0:8083}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
