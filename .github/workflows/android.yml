name: Android CI & Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "android/**"
      - "protocol/**"
      - "server/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Unit Tests, Lint & Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run unit tests, Go-interop tests & lint
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug

      - name: Decode Android release keystore (when configured)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] || [ -n "$KEYSTORE_PASS" ] || [ -n "$KEY_ALIAS" ] || [ -n "$KEY_PASS" ]; then
            if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
              echo "Error: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD must all be set together." >&2
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature (when signed)
        if: steps.signing.outputs.signed == 'true'
        run: |
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER" || { echo "apksigner not found under Android SDK build-tools" >&2; exit 1; }
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: all-notify-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
