name: Desktop CI & Bundles

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "protocol/**"
      - "server/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact_path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            platform: windows
            artifact_path: |
              desktop/src-tauri/target/release/bundle/msi/*.msi
              desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Syntax-check frontend JS
        run: node --check desktop/src/app.js

      - name: Run cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust unit & live Go-relay E2E matrix tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Install Tauri CLI & build native bundle
        working-directory: desktop
        run: |
          npm ci
          npm run tauri build

      - name: Verify macOS app bundle code signature
        if: matrix.platform == 'macos'
        run: |
          APP="desktop/src-tauri/target/release/bundle/macos/All-Notify.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          INFO=$(codesign -dv --verbose=4 "$APP" 2>&1)
          echo "$INFO"
          echo "$INFO" | grep -q "Identifier=com.allnotify.desktop"
          echo "$INFO" | grep -q "Info.plist entries="

      - name: Upload native desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: all-notify-desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
